<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .tabs {
            background-color: deeppink;
            display: flex;
            gap: 10px;
            padding: 15px 15px 0 15px;
            list-style: none;
            margin: 0;
        }
        .tabs li {
            background-color: white;
            padding: 10px 30px;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
        }
        .tab2 {
            opacity: 0.7;
        }
        .box {
            min-height: 300px;
            background-color: white;
            padding: 20px;
            border: 15.9px solid deeppink;
            border-top: 0 none;
        }
        #box2 {
            display: none;
        }
    </style>
</head>
<body>
    <ul class="tabs">
        <li class="tab1" onclick="one()">Tab One</li>
        <li class="tab2" onclick="two()">Tab Two</li>
    </ul>
    <div class="box" id="box1">Box 1</div>
    <div class="box" id="box2">Box 2</div>
    <script>
        function two() {
            var two = document.querySelector("#box2");
            var one = document.querySelector("#box1");
            two.style.display = "block";
            one.style.display = "none";
            var tab2 = document.querySelector(".tab2");
            var tab1 = document.querySelector(".tab1");
            tab1.style.opacity = "0.7";
            tab2.style.opacity = "1";
        }
        function one() {
            var two = document.querySelector("#box2");
            var one = document.querySelector("#box1");
            two.style.display = "none";
            one.style.display = "block";
            var tab2 = document.querySelector(".tab2");
            var tab1 = document.querySelector(".tab1");
            tab1.style.opacity = "1";
            tab2.style.opacity = "0.7";
        }
    </script>
</body>
</html>
