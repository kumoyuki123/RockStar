<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDOList</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container" style="max-width:600px">
            <a href="#" class="navbar-brand">To DO List <span class="badge bg-danger rounded-pill ms-2">0</span></a>
        </div>
    </nav>
    <div class="container" style="max-width:600px">
        <form class="input-group my-4">
            <input type="text" class="form-control">
            <button class="btn btn-primary">Submit</button>
        </form>
        <ul id="todo" class="list-group"></ul>
        <ul id="done" class="list-group mt-4 opacity-50"></ul>
    </div>
    <!-- <input type="text">
    <button>Submit</button>
    <ul id="todo"></ul> -->
    <script>
        // document.querySelector("input").onkeydown = e => {
        //     if(e.key == 'Enter') {
        //         document.querySelector("button").onclick();
        //     }
        // }
        // document.querySelector("button").onclick = () => {
        //     let text = document.querySelector("input").value;
        //     if(text == '') return false;
        //     createItem(text);
        //     document.querySelector("input").value = "";
        //     document.querySelector("input").focus();
        // }
        let data = getData();
        data.map(item => createItem(item.text, item.done));
        updateCount();
        function getData() {
            return JSON.parse(localStorage.getItem("data")) || [];
        }
        function saveData(text) {
            let data = getData();
            data.push({text,done:false});
            localStorage.setItem("data", JSON.stringify(data));
        }
        function removeData(text) {
            let data = getData();
            let result = data.filter(item => text != item.text);
            localStorage.setItem("data", JSON.stringify(result));
        }
        function checkData(text) {
            let data = getData();
            let result = data.map(item => {
                if(item.text == text) item.done = true;
                return item;
            });
            localStorage.setItem("data", JSON.stringify(result));
        }
        function updateCount() {
            document.querySelector(".badge").textContent = 
            document.querySelectorAll("#todo li").length;
        }
        document.querySelector("form").onsubmit = e => {
            e.preventDefault();
            let text = document.querySelector("input").value;
            if(text == '') return false;
            createItem(text);
            updateCount();
            saveData(text);
            e.currentTarget.reset();
        }
        function createItem(text, done = false) {
            let li = document.createElement("li");
            li.textContent = text;
            li.classList.add("list-group-item");

            let del = document.createElement("a");
            del.setAttribute("href", "#");
            del.classList.add("fa-solid", "fa-trash", "text-danger", "float-end");
            del.onclick = () => {
                li.remove();
                updateCount();
                removeData(text);
            }
            li.appendChild(del);

            let check = document.createElement("a");
            check.setAttribute("href", "#");
            check.classList.add("fa-solid", "fa-check", "me-2", "float-start");
            check.onclick = () => {
                document.querySelector("#done").appendChild(li);
                check.remove();
                updateCount();
                checkData(text);
            }
            if(!done) li.appendChild(check);

            if(done) {
                document.querySelector("#done").appendChild(li);
            } else {
                document.querySelector("#todo").appendChild(li);
            }
        }
    </script>
</body>
</html>
